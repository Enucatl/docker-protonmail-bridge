services:
  protonmail-bridge:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-medium
    image: ghcr.io/enucatl/proton-bridge:latest
    platform: linux/amd64
    user: "1000:1000"
    restart: unless-stopped
    command: ["--noninteractive", "--vault-key-file", "/run/secrets/bridge_vault_key"]
    secrets:
      - bridge_vault_key
    ports:
      - "10243:1143"
      - "10125:1025"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=0700,uid=1000,gid=1000
    volumes:
      - bridge-state:/data
      - /opt/docker/traefik/data/certs/docker_key.pem:/protonmail/certs/key.pem:ro
      - /opt/docker/traefik/data/certs/docker_fullchain.pem:/protonmail/certs/cert.pem:ro

networks:
  default:
    enable_ipv6: true

volumes:
  bridge-state:

secrets:
  bridge_vault_key:
    file: ./secrets/vault_key
