name: Trivy Remediation

on:
  workflow_run:
    workflows:
      - Build and Push Image
    types:
      - completed

permissions: {}

jobs:
  remediate:
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: Enucatl/docker-compose-security-baseline/.github/workflows/trivy-remediation.yml@main
    with:
      run_id: ${{ github.event.workflow_run.id }}
      checkout_ref: ${{ github.event.workflow_run.head_sha }}
      source_workflow_name: Build and Push Image
      trusted_branch: main
      model: deepseek/deepseek-v4.1-flash
      effort: low
      provider_name: OpenRouter
      provider_base_url: https://openrouter.ai/api/v1
      provider_env_key: OPENROUTER_API_KEY
      provider_wire_api: responses
      report_artifact: trivy-image-report
      report_path: trivy-remediation.json
      skill_path: .agents/skills/trivy-remediation/SKILL.md
    secrets:
      model_api_key: ${{ secrets.OPENROUTER_API_KEY }}
